<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typotheque type foundry - unique, high quality fonts for print and screens</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>   

<header class="top">
  <div class="nav-left">
    <img src="images/logo typotheque.png" alt="Typotheque logo" class="logo">
     <button class="menu-button"><i class="fa-solid fa-bars"></i></button>
</div>

    <div class="nav-right">
      <button class="login-button">Log In</button>
      <button class="search-button"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
  </header>


  <main class="grid-container">    
    <div class="zed">
      <div class="zedtext">ZED</div>
      <video src="images/zed video.mp4" alt="zed-video" class="zed-video" autoplay muted loop playsinline></video>
     
    <div class="font-indicator weight-indicator">
    <span class="dot"></span>
    <div class="line"></div>
    <div class="indicator-text">Weight<br>900</div>
    </div>

    <div class="font-indicator width-indicator">
    <span class="dot"></span>
    <div class="line"></div>
    <div class="indicator-text">Width<br>180</div>
    </div>

    <div class="font-indicator rounding-indicator">
    <span class="dot"></span>
    <div class="line"></div>
    <div class="indicator-text">Rounding<br>45</div>
    </div>

    <div class="font-indicator slant-indicator">
    <span class="dot"></span>
    <div class="line"></div>
    <div class="indicator-text">Slant<br>35</div>
    </div>

  </div>
    <div class="globalfonts">
      <span>Global Fonts</span> 
      <img src="images/global fonts.png" alt="global fonts" class="globalfonts"></div>
    <div class="variablefonts">
      <span>Variable Fonts</span>
      <img src="images/variable fonts.png" alt="variable fonts" class="variablefonts"></div>
    <div class="smartfonts">
      <span>Smart Fonts</span>
      <img src="images/smart fonts.png" alt="smart fonts" class="smartfonts"></div>
    <div class="allfonts">
      <span>All Fonts</span>
      <img src="images/all fonts.png" alt="all fonts" class="allfonts"></div>
    <div class="superfamilies">
      <span>Super Families</span>
      <img src="images/super families.png" alt="super families" class="superfamilies"></div>
    <div class="legibilityfonts">
      <span>Legibility Fonts</span>
      <img src="images/legibility fonts.png" alt="legibility fonts" class="legibilityfonts"></div>
    <div class="opticalsizes">
      <span>Optical Sizes</span>
      <img src="images/optical sizes.png" alt="optical sizes" class="opticalsizes"></div>
</main>
</body>
</html>
